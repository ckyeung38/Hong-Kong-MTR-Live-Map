}

const API = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php";

function lineStations(L) {
  const set = new Set(L.main);
  for (const b of L.branches) for (const c of b) set.add(c);
  return [...set];
}

async function fetchStation(line, code) {
  const url = API + "?line=" + encodeURIComponent(line) + "&sta=" + encodeURIComponent(code) + "&lang=TC";
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    if (r.status === 429) { const e = new Error("429"); e.is429 = true; throw e; }
    if (!r.ok) { const e = new Error("http " + r.status); e.retryable = r.status >= 500; throw e; }
    return await r.json();
  } finally { clearTimeout(to); }
}

async function runPool(tasks, n, fn) {
  let i = 0;
  const workers = Array.from({ length: n }, async () => {
    while (i < tasks.length) { const t = tasks[i++]; try { await fn(t); } catch (e) {} }
  });
  await Promise.all(workers);
}

async function refreshCycle() {
  const tasks = [];
  for (const L of LINES) for (const c of lineStations(L)) tasks.push([L, c]);
  let ok = 0, fail = 0, got429 = false;
  const t0 = Date.now();
  const doOne = async ([L, code]) => {
    try {
      const j = await fetchStation(L.code, code);
      const key = L.code + "-" + code;
      const d = (j.data && j.data[key]) || {};
      (store[L.code] = store[L.code] || {})[code] = {
        up: parseEntries(d.UP), down: parseEntries(d.DOWN),
        msg: j.status === 0 ? j.message : null, ts: Date.now()
      };
      ok++;
      return true;
    } catch (e) { if (e && e.is429) got429 = true; return false; }
  };
  const failed = [];
  await runPool(tasks, 4, async (t) => { if (!(await doOne(t))) failed.push(t); });
  // 失敗嘅站即刻重試一次，唔好留空
  let stillFailed = 0;
  if (failed.length) {
    await sleep(2000);
    await runPool(failed, 2, async (t) => { if (!(await doOne(t))) stillFailed++; });
  }
  fail = stillFailed;
  apiBackoffMs = got429 ? Math.min(apiBackoffMs ? apiBackoffMs * 2 : 15000, 300000) : 0;
  if (ok > 0) lastCycleOk = Date.now();
  return { ok, fail, ms: Date.now() - t0 };
}

    let j = 0;

    b.forEach((c, k) => { if (!(c in pos)) pos[c] = base + 0.5 + k * 0.01; });

    const frac = Math.min(1, Math.max(0, (s.dist - cum[i]) / span));

      ? { from: main[i], to: main[i + 1], frac }
      : { from: main[i + 1], to: main[i], frac };
  }
  const ch = train.chain;
  for (const r of ch) if (Math.abs(now - r.t) < 20000) return { at: r.code };
  if (now < ch[0].t) {
    const prev = neighborCode(L, pos, ch[0].code, -train.dir);
    if (!prev) return { at: ch[0].code };
    const st = segTime(L, prev, ch[0].code);
    const remain = (ch[0].t - now) / 1000;
    if (remain <= st) return { from: prev, to: ch[0].code, frac: 1 - remain / st };
    return { at: prev };
  }
  for (let i = 0; i < ch.length - 1; i++) {
    if (now >= ch[i].t && now < ch[i + 1].t) {
      const span = (ch[i + 1].t - ch[i].t) / 1000;
      const frac = span > 0 ? (now - ch[i].t) / 1000 / span : 0;
      return trackSeg(L, pos, ch[i].code, ch[i + 1].code, Math.min(1, Math.max(0, frac)));
    }
  }
  const last = ch[ch.length - 1];
  const next = neighborCode(L, pos, last.code, train.dir);
  if (!next) return null;
  const st = segTime(L, last.code, next);
  const el = (now - last.t) / 1000;
  if (el <= st) return { from: last.code, to: next, frac: el / st };
  return null;
}

// ================= RENDER =================
const $ = (id) => document.getElementById(id);
let canvas, ctx, DPR = 1, W = 0, H = 0;
const cam = { x: 0, y: 0, k: 1 };
let fitK = 1; // fitView 時嘅 scale，label 閾值用
const vis = {}; // lineCode -> bool
let hoverStation = null, hoverTrain = null, selected = null, tipTrain = null;
let dark = false;
function applyDark() {
  document.body.classList.toggle("dark", dark);
  const b = $("btnDark");
  if (b) b.textContent = dark ? "☀️" : "🌙";
  try { localStorage.setItem("mtrDark", dark ? "1" : "0"); } catch (e) {}
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function fitView() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const c in SCHEM) {
    const x = SCHEM[c][0], y = trY(SCHEM[c][1]);
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const pad = 0.1;
  cam.k = Math.min(W / ((x1 - x0) * (1 + pad)), H / ((y1 - y0) * (1 + pad)));

  cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2;
}
const sX = (x) => (x - cam.x) * cam.k + W / 2;
const sY = (y) => (y - cam.y) * cam.k + H / 2;
// 維港拉闊：尖沙咀/尖東（y≈1470-1510）同港島（y≈1690）喺 schematic 太迫，
// 用 smoothstep 將維港一帶垂直拉開 120 單位（適中，唔好拉到唔自然），車站、水域、標籤一齊變形保持一致
const HARB_Y = 1550, HARB_HW = 110, HARB_GAP = 200;
function trY(y) {
  if (y <= HARB_Y - HARB_HW) return y;
  if (y >= HARB_Y + HARB_HW) return y + HARB_GAP;
  const t = (y - (HARB_Y - HARB_HW)) / (2 * HARB_HW);
  return y + HARB_GAP * (t * t * (3 - 2 * t));
}
function stXY(code) { const s = SCHEM[code]; return s ? [sX(s[0]), sY(trY(s[1]))] : [W/2, H/2]; }

function lineRuns(L) {
  return [L.main].concat(L.branches).map(run => run.filter(c => STATIONS[c])).filter(r => r.length > 1);

function strokeRun(run, color, width, alpha) {

  } else {
    // 圓角曲線（跟官方站圖：直綫 + 圓角彎）
    const R = 16;
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
      const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      const d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      if (d1 < 2 || d2 < 2) { ctx.lineTo(p1[0], p1[1]); continue; }
      const r = Math.min(R, d1 * 0.4, d2 * 0.4);
      const ax = p1[0] - (p1[0] - p0[0]) / d1 * r, ay = p1[1] - (p1[1] - p0[1]) / d1 * r;
      const bx = p1[0] + (p2[0] - p1[0]) / d2 * r, by = p1[1] + (p2[1] - p1[1]) / d2 * r;
      ctx.lineTo(ax, ay);

function rr(x, y, w, h, r) {

  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 子彈頭列車：綫色車身 + 白色尖車頭（方向一望就知）+ 側窗
function drawTrainCar(x, y, ang, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  // 方案A：簡約圓點（綫色）+ 白色方向箭

  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "#1f2d3a"; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(5.5, 0); ctx.lineTo(-1.5, -4.5); ctx.lineTo(-1.5, 4.5);
  ctx.closePath();
  ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.restore();
}
function interchangeSet() {
  const count = {};
  for (const L of LINES) { if (!vis[L.code]) continue; for (const c of lineStations(L)) count[c] = (count[c] || 0) + 1; }
  return count;
}
function draw(now) {

    for (let i = 0; i < ring.length; i++) {

  const tsyw = [[835.0,1060.0],[818.7,1120.7],[772.9,1169.5],[706.7,1196.5],[543.3,1196.5],[477.1,1169.5],[431.3,1120.7],[415.0,1060.0],[431.3,999.3],[477.1,950.5],[543.3,1020.0],[706.7,1020.0],[772.9,950.5],[818.7,999.3]];
  const tsyi = [[800.0,1092.0],[788.6,1124.5],[757.5,1148.3],[715.0,1157.0],[672.5,1148.3],[641.4,1124.5],[630.0,1092.0],[641.4,1059.5],[672.5,1035.7],[715.0,1027.0],[757.5,1035.7],[788.6,1059.5]];
  ctx.beginPath();
  tsyw.forEach((p, i) => i ? ctx.lineTo(sX(p[0]), sY(trY(p[1]))) : ctx.moveTo(sX(p[0]), sY(trY(p[1]))));
  ctx.closePath();
  ctx.fillStyle = P.water; ctx.fill();
  ctx.beginPath();
  tsyi.forEach((p, i) => i ? ctx.lineTo(sX(p[0]), sY(trY(p[1]))) : ctx.moveTo(sX(p[0]), sY(trY(p[1]))));
  ctx.closePath();
  ctx.fillStyle = P.bg; ctx.fill();
  // 機場島水道：切開機場半島同大陸嘅連接，機場/博覽館變返離島
  const apw = [[588.0,1125.0],[553.9,1145.7],[508.5,1159.1],[455.4,1163.5],[404.5,1163.7],[329.6,1168.6],[300.2,1146.6],[328.0,1125.0],[319.6,1106.6],[346.4,1088.7],[397.5,1075.7],[462.3,1076.0],[491.7,1098.2],[534.5,1107.6]];
  ctx.beginPath();
  apw.forEach((p, i) => i ? ctx.lineTo(sX(p[0]), sY(trY(p[1]))) : ctx.moveTo(sX(p[0]), sY(trY(p[1]))));
  ctx.closePath();
  ctx.fillStyle = P.water; ctx.fill();
  // 地區標籤（官方站圖風格）：halo 確保唔俾路線遮住
  ctx.textAlign = "center";
  for (const [tc, en, lx, ly] of REGION_LABELS) {
    const x = sX(lx), y = sY(trY(ly));
    if (x < -100 || x > W + 100 || y < -100 || y > H + 100) continue;
    ctx.lineWidth = 4; ctx.strokeStyle = P.halo;
    ctx.font = "600 13px sans-serif";
    ctx.strokeText(tc, x, y); ctx.fillStyle = P.region; ctx.fillText(tc, x, y);

    ctx.beginPath(); ctx.arc(x, y, 8, 0, 7);
    ctx.fillStyle = P.bg; ctx.fill();
  }

  // 綫路（白底鑲邊 + 主綫）
  for (const L of LINES) {
    if (!vis[L.code]) continue;
    for (const run of lineRuns(L)) {
      strokeRun(run, P.casing, 7.5, 0.9);
      strokeRun(run, L.color, 4.5, 1);
    }

  const showEN = cam.k > fitK * 2.2;   // 英文站名
  for (const L of LINES) {
    if (!vis[L.code]) continue;
    for (const c of lineStations(L)) {
      const [x, y] = stXY(c);
      if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
      const isX = (xchg[c] || 0) > 1;
      if (isX) {
        // 轉車站：彩色圓環，每條可轉乘嘅綫佔一段，一望就知轉得邊幾條綫
        const xlines = [];
        for (const L of LINES) { if (vis[L.code] && lineStations(L).indexOf(c) >= 0) xlines.push(L); }
        const n = Math.max(2, xlines.length);
        ctx.beginPath(); ctx.arc(x, y, 7.6, 0, 7);
        ctx.fillStyle = P.stFill; ctx.fill();
        ctx.lineWidth = 3.4;

        const nm = STATIONS[c][2], en = STATIONS[c][3];
        const lo = (typeof LBL_OFF !== "undefined" && LBL_OFF[c]) || [9, -12, "left"];
        ctx.textAlign = lo[2]; ctx.textBaseline = "top";
        ctx.font = "600 12px sans-serif";
        ctx.lineWidth = 3.5; ctx.strokeStyle = P.halo;

        ctx.fillStyle = P.label; ctx.fillText(nm, x + lo[0], y + lo[1]);

  for (const t of trains) {

    const p = trainPosAt(t, now);

    let ang;

      t._ang = ang;
    }
    drawTrainCar(x, y, ang, t.L.color);

      ctx.beginPath(); ctx.arc(x, y, 14, 0, 7);
      ctx.strokeStyle = P.hoverRing; ctx.lineWidth = 1.4; ctx.stroke();
    }
  }
}

// ---- pointer ----
function bindPointer() {
  const pointers = new Map();
  let moved = 0, pinchD0 = 0, pinchK0 = 1, downXY = null;
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    moved = 0; downXY = [e.clientX, e.clientY];
    if (pointers.size === 2) {
      const p = [...pointers.values()];
      pinchD0 = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]); pinchK0 = cam.k;
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    const prev = pointers.get(e.pointerId);
    if (prev) {
      moved += Math.abs(e.clientX - prev[0]) + Math.abs(e.clientY - prev[1]);
      pointers.set(e.pointerId, [e.clientX, e.clientY]);
    }
    if (pointers.size === 2) {
      const p = [...pointers.values()];
      const d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
      if (pinchD0 > 0) zoomAt((p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2, pinchK0 * d / pinchD0);
      return;
    }
    if (pointers.size === 1 && prev) {
      cam.x -= (e.clientX - prev[0]) / cam.k;
      cam.y -= (e.clientY - prev[1]) / cam.k;
      hideTooltip();
    }
    updateHover(e.clientX, e.clientY);
  });
  const up = (e) => {
    pointers.delete(e.pointerId);
    if (moved < 8 && downXY) handleTap(e.clientX, e.clientY);
    downXY = null;
  };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, cam.k * Math.pow(1.0015, -e.deltaY)); }, { passive: false });
  canvas.addEventListener("dblclick", () => defaultView());
}
function defaultView() {
  fitView();
  // 直式電話睇全圖會變幼幼一條：預設放大 2.6x 聚焦網絡中心（市區），其餘撳 －/拖拽去睇
  zoomAt(W / 2, H / 2, fitK * 2.6);
}
function zoomAt(px, py, nk) {
  nk = Math.min(fitK * 60, Math.max(fitK * 0.6, nk));
  const wx = cam.x + (px - W / 2) / cam.k, wy = cam.y + (py - H / 2) / cam.k;
  cam.k = nk;
  cam.x = wx - (px - W / 2) / cam.k; cam.y = wy - (py - H / 2) / cam.k;
}
function nearestStation(px, py, maxD) {
  let best = null, bd = maxD;
  for (const L of LINES) {
    if (!vis[L.code]) continue;
    for (const c of lineStations(L)) {
      const [x, y] = stXY(c);
      const d = Math.hypot(px - x, py - y);
      if (d < bd) { bd = d; best = c; }
    }
  }
  return best;
}
function nearestTrain(px, py, maxD) {
  let best = null, bd = maxD;
  for (const t of trains) {
    if (!vis[t.L.code] || t._x === undefined) continue;
    const d = Math.hypot(px - t._x, py - t._y);
    if (d < bd) { bd = d; best = t; }
  }
  return best;
}
function updateHover(px, py) {
  hoverTrain = nearestTrain(px, py, 16);
  hoverStation = hoverTrain ? null : nearestStation(px, py, 14);
  canvas.style.cursor = (hoverTrain || hoverStation) ? "pointer" : "grab";
  if (hoverTrain) showTrainTip(hoverTrain, px, py); else hideTooltip();
}
function handleTap(px, py) {
  const t = nearestTrain(px, py, 20);
  if (t) {
    // 撳同一列車第二次就收埋 tooltip（toggle）
    if (tipTrain === t && $("tooltip").style.display === "block") { hideTooltip(); return; }
    tipTrain = t; showTrainTip(t, px, py, true); return;
  }
  const c = nearestStation(px, py, 16);
  if (c) {
    // 撳同一車站第二次就收埋時間表（toggle）
    if (selected === c && $("panel").classList.contains("open")) { closeStation(); return; }
    openStation(c); return;
  }
  // 撳空白位：收埋晒
  hideTooltip(); closeStation();
}
function closeStation() { selected = null; $("panel").classList.remove("open"); }
// 飛去指定車站（搜尋 / 定位用）
function goStation(code) {
  const s = SCHEM[code];
  if (!s) return;
  cam.x = s[0]; cam.y = trY(s[1]);
  zoomAt(W / 2, H / 2, fitK * 4);
  openStation(code);
}
// 車站搜尋
function bindSearch() {
  const inp = $("searchInput"), res = $("searchResults");
  const close = () => res.classList.remove("open");
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    res.innerHTML = "";
    if (!q) { close(); return; }
    let n = 0;
    for (const code in STATIONS) {
      const s = STATIONS[code];
      if ((s[2] + " " + s[3] + " " + code).toLowerCase().indexOf(q) < 0) continue;
      let dots = "";
      for (const L of LINES) { if (lineStations(L).indexOf(code) >= 0) dots += '<span class="dot" style="background:' + L.color + '"></span>'; }
      const el = document.createElement("div");
      el.className = "srItem";
      el.innerHTML = dots + esc(s[2]) + '<span class="en">' + esc(s[3]) + "</span>";
      el.onclick = ((c) => () => { close(); inp.value = ""; inp.blur(); goStation(c); })(code);
      res.appendChild(el);
      if (++n >= 8) break;
    }
    res.classList.toggle("open", n > 0);
  });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { inp.value = ""; close(); inp.blur(); }
  });
  document.addEventListener("pointerdown", (e) => {
    const bar = $("searchbar");
    if (bar && !bar.contains(e.target)) close();
  });
}

function locateMe() {
  if (!navigator.geolocation) { flashErr("呢個瀏覽器唔支援定位"); return; }
  const insecure = location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1";
  flashErr("定位緊…（第一次用要撳「允許」）");
  navigator.geolocation.getCurrentPosition((pos) => {
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    let best = null, bd = 1e9;
    for (const code in STATIONS) {
      const s = STATIONS[code];
      const d = haversineKm(la, lo, s[0], s[1]);
      if (d < bd) { bd = d; best = code; }
    }
    const eb = $("errbar");
    if (eb.textContent.indexOf("定位緊") === 0) eb.style.display = "none";
    if (best) goStation(best);
  }, (err) => {
    if (err.code === 1) {
      flashErr(insecure
        ? "定位用唔到：經檔案開啟冇定位權限，請用 https 下載連結開，或者去瀏覽器設定開返定位權限"
        : "定位被拒：請喺網址列撳 ⓘ → 網站設定 → 開返「定位」權限，再撳多次 📍");
    } else if (err.code === 3) {
      flashErr("定位逾時：請去空曠啲嘅地方再試一次");
    } else {
      flashErr("攞唔到你嘅位置，請稍後再試");
    }
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

// ================= UI =================
let trains = [];
let simMode = false, simSince = 0, simTrains_ = [];

function setBadge(kind, text) {
  const b = $("badge");
  b.className = kind; b.textContent = text;
}
// 列車未來幾站預計到達（沿路軌向前行，用 segTime 估算）
function trainETAs(t, now) {
  const L = t.L, pos = t.pos;
  const p = trainPosAt(t, now);
  if (!p) return [];
  const chainT = {};
  if (!t.sim && t.chain) for (const r of t.chain) chainT[r.code] = r.t;
  const etas = [];
  let cur, acc;
  if (p.at) { cur = p.at; acc = 0; }
  else {
    const st = segTime(L, p.from, p.to);
    acc = Math.max(0, (1 - p.frac) * st);
    cur = p.to;
    etas.push({ code: p.to, sec: acc, live: chainT[p.to] > now });
    if (chainT[p.to] > now) etas[0].sec = (chainT[p.to] - now) / 1000;
  }
  let guard = 0;
  while (etas.length < 4 && guard++ < 24) {
    const nx = neighborCode(L, pos, cur, t.dir);
    if (!nx || nx === cur) break;
    acc += segTime(L, cur, nx);
    cur = nx;
    let sec = acc, live = false;
    if (chainT[nx] > now) { sec = (chainT[nx] - now) / 1000; live = true; }
    if (!etas.length || etas[etas.length - 1].code !== nx) etas.push({ code: nx, sec, live });
  }
  return etas;
}
function showTrainTip(t, px, py, sticky) {
  const tip = $("tooltip");
  const d = STATIONS[t.dest];
  const now = Date.now();
  const etas = trainETAs(t, now);
  let html = '<div style="margin-bottom:4px"><span class="lineTag" style="background:' + t.L.color + '"></span><b>' +
    esc(t.L.tc) + "</b> 往 " + esc(d ? d[2] : t.dest) + "</div>";
  if (!etas.length) {
    html += '<div style="font-size:11px;color:#7c8fa3">暫無到站資料</div>';
  } else {
    for (const e of etas) {
      const s = STATIONS[e.code];
      const mins = Math.max(0, Math.round(e.sec / 60));
      const when = e.sec < 45 ? "即將到站" : mins <= 0 ? "即將到站" : mins + " 分鐘";
      html += '<div style="display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:2px 0">' +
        "<span>" + esc(s ? s[2] : e.code) + "</span>" +
        '<span style="color:' + (e.sec < 45 ? "#137333;font-weight:700" : "#5a6d7e") + '">' + when + "</span></div>";
    }
  }
  tip.innerHTML = html;
  tip.style.display = "block";
  tip.style.left = Math.max(8, Math.min(W - 190, px + 12)) + "px";
  tip.style.top = Math.max(8, py - 40 - etas.length * 22) + "px";
  if (sticky) { clearTimeout(tip._to); tip._to = setTimeout(hideTooltip, 6000); }
}
function hideTooltip() { $("tooltip").style.display = "none"; tipTrain = null; }

function buildChips() {
  const box = $("chips"); box.innerHTML = "";
  for (const L of LINES) {
    vis[L.code] = true;
    const el = document.createElement("div");
    el.className = "chip";
    el.innerHTML = '<span class="dot" style="background:' + L.color + '"></span>' + esc(L.tc);
    el.onclick = () => { vis[L.code] = !vis[L.code]; el.classList.toggle("off", !vis[L.code]); if (selected && !$("panel").classList.contains("open")) {} };
    box.appendChild(el);
  }
}
function openStation(code) {
  selected = code;
  const s = STATIONS[code];
  $("panelName").textContent = s[2];
  let nL = 0;
  for (const L of LINES) { if (lineStations(L).indexOf(code) >= 0) nL++; }
  $("panelEn").textContent = s[3] + (nL > 1 ? " · 可轉乘 " + nL + " 條綫" : "");
  const body = $("panelBody"); body.innerHTML = "";
  const now = Date.now();
  for (const L of LINES) {
    if (!vis[L.code]) continue;
    if (lineStations(L).indexOf(code) < 0) continue;
    const rec = (store[L.code] || {})[code];
    const wrap = document.createElement("div");
    let html = '<div style="margin:10px 0 2px;font-size:13px;font-weight:700"><span class="lineTag" style="background:' + L.color + '"></span>' + esc(L.tc) + "</div>";
    if (simMode) {
      html += '<div class="dep"><span class="meta">模擬模式：未能取得實時班次</span></div>';
    } else if (!rec) {
      html += '<div class="dep"><span class="meta">載入中…</span></div>';
    } else {
      if (rec.msg) html += '<div class="dep"><span class="meta">' + esc(rec.msg) + "</span></div>";
      const all = rec.up.concat(rec.down).sort((a, b) => a.t - b.t).slice(0, 4);
      if (!all.length) html += '<div class="dep"><span class="meta">暫無班次資料（可能已收車）</span></div>';
      for (const e of all) {
        const d = STATIONS[e.dest];
        html += '<div class="dep"><span class="dest">往 ' + esc(d ? d[2] : e.dest) + "</span>" +
          '<span class="meta">' + (e.plat ? esc(e.plat) + "號月台" : "") + "</span>" +
          '<span class="mins">' + esc(minsText(e.t, now)) + "</span></div>";
      }
    }
    // 頭班車 / 尾班車（到本站時間，每個方向一行）
    const fls = firstLastAt(L, code);
    for (const f of fls) {
      html += '<div class="dep fl"><span class="dest">往 ' + esc(f.tc) + "</span>" +
        '<span class="meta">頭班車 ' + f.first + " · 尾班車 " + f.last + "</span></div>";
    }
    wrap.innerHTML = html;
    body.appendChild(wrap);
  }
  $("panel").classList.add("open");
}
function tickClock() { $("clock").textContent = fmtClock(new Date()); }

// ================= SIM（後備模式） =================
function enterSim(reason) {
  if (simMode) return;
  simMode = true; simSince = Date.now(); simTrains_ = [];
  const H = { TWL: 180, ISL: 180, KTL: 180, TKL: 180, SIL: 180, DRL: 180, TML: 240, EAL: 300, TCL: 300, AEL: 600 };
  for (const L of LINES) {
    const main = L.main.filter(c => STATIONS[c]);
    const cum = [0];
    for (let i = 0; i < main.length - 1; i++) {
      const A = STATIONS[main[i]], B = STATIONS[main[i + 1]];
      cum.push(cum[i] + haversineKm(A[0], A[1], B[0], B[1]) * 1000);
    }
    const len = cum[cum.length - 1];
    const routeTime = len / (L.speed * 1000 / 3600);
    const n = Math.max(2, Math.min(28, Math.round(routeTime * 2 / (H[L.code] || 240))));
    for (let k = 0; k < n; k++) {
      const dd = (k * 2 * len) / n;
      const dir = dd < len ? 1 : -1;
      simTrains_.push({ L, pos: buildPos(L), dest: dir > 0 ? main[main.length - 1] : main[0], dir, sim: { main, cum, len, dist: dir > 0 ? dd : 2 * len - dd, v: L.speed * 1000 / 3600 } });
    }
  }
  rebuildTrains();
  setBadge("sim", "模擬模式");
  const eb = $("errbar");
  if (reason) { eb.textContent = reason + " — 先用模擬班次顯示，恢復後自動切回實時。"; eb.style.display = "block"; }
}
function simTick(dtMs) {
  for (const t of simTrains_) {
    const s = t.sim;
    s.dist += t.dir * s.v * dtMs / 1000;
    if (s.dist >= s.len) { s.dist = 2 * s.len - s.dist; t.dir = -1; t.dest = s.main[0]; }
    else if (s.dist <= 0) { s.dist = -s.dist; t.dir = 1; t.dest = s.main[s.main.length - 1]; }
  }
}

// ================= MAIN =================
function rebuildTrains() {
  const nowD = new Date();
  if (simMode) { trains = simTrains_.filter(t => vis[t.L.code] && lineInService(t.L, nowD)); }
  else {
    trains = [];
    for (const L of LINES) {
      if (!vis[L.code]) continue;
      if (!lineInService(L, nowD)) continue; // 過咗尾班車、未到頭班車：唔 show 呢條綫嘅車
      const pos = buildPos(L);
      trains.push.apply(trains, linkTrains(L, pos, collectReports(L, pos)));
    }
  }
  const n = trains.length;
  $("trainCount").textContent = n ? "🚇 " + n + " 列車行駛中" : "";
  if (!simMode) {
    // 深夜收車：唔再扮有車行，badge 話埋比人知
    if (n === 0) setBadge("rest", "深夜休息中");
    else if ($("badge").className === "rest") setBadge("live", "實時");
  }
}
async function refreshLoop() {
  // ?sim=1 強制模擬（測試用）
  try { if (new URLSearchParams(location.search).get("sim") === "1") { enterSim(""); return; } } catch (e) {}
  while (true) {
    if (!document.hidden) {
      if (!simMode) {
        setBadge("updating", "更新中…");
        const r = await refreshCycle();
        if (r.ok === 0 && lastCycleOk === 0) enterSim("未能連接港鐵實時班次");
        else { rebuildTrains(); if (trains.length) setBadge("live", "實時"); $("errbar").style.display = "none"; }
      } else if (Date.now() - simSince > 5 * 60000) {
        // 模擬模式下每 5 分鐘靜靜試一次實時
        const r = await refreshCycle();
        if (r.ok > 0) { simMode = false; $("errbar").style.display = "none"; rebuildTrains(); if (trains.length) setBadge("live", "實時"); }
        else simSince = Date.now();
      }
    }
    await sleep(60000 + apiBackoffMs);
  }
}
let lastFrame = 0;
function frame(rafNow) {
  const dt = Math.min(100, rafNow - (lastFrame || rafNow)); lastFrame = rafNow;
  if (simMode) simTick(dt);
  draw(Date.now()); // 列車定位一定要用真實時間，唔用 rAF timestamp
  requestAnimationFrame(frame);
}
function init() {
  canvas = $("map"); ctx = canvas.getContext("2d");
  resize(); window.addEventListener("resize", resize);
  buildChips(); defaultView(); bindPointer();
  $("zin").onclick = () => zoomAt(W / 2, H / 2, cam.k * 1.6);
  $("zout").onclick = () => zoomAt(W / 2, H / 2, cam.k / 1.6);
  $("zreset").onclick = () => defaultView();
  $("panelClose").onclick = () => { $("panel").classList.remove("open"); selected = null; };
  try { dark = localStorage.getItem("mtrDark") === "1"; } catch (e) {}
  applyDark();
  $("btnDark").onclick = () => { dark = !dark; applyDark(); };
  $("btnLoc").onclick = locateMe;
  bindSearch();
  tickClock(); setInterval(tickClock, 1000);
  setInterval(() => { if (!simMode && lastCycleOk) rebuildTrains(); }, 15000);
  requestAnimationFrame(frame);
  refreshLoop();
}
if (typeof window !== "undefined") {
  window.MTRMAP = { STATIONS, LINES, haversineKm, parseApiTime, parseEntries, buildPos, segTime, collectReports, linkTrains, neighborCode, trainPosAt, lineStations, minsText, trY, FIRST_LAST, firstLastAt, lineInService, t2m, m2t };
  if (!window.__TEST__ && typeof document !== "undefined" && document.getElementById && document.getElementById("map")) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  }
}

</script>
